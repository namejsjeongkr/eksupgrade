[project]
name = "eksupgrade"
version = "0.10.0"
description = "The Amazon EKS cluster upgrade utility"
authors = [{ name = "EKS Upgrade Maintainers", email = "eks-upgrade-maintainers@amazon.com" }]
readme = "README.md"
license = "MIT-0"
requires-python = ">=3.12"
keywords = ["amazon", "aws", "aws-samples", "eks", "kubernetes", "upgrade", "eksupgrade"]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "boto3>=1.34",
    "kubernetes>=29.0.0,<35.0.0",
    "packaging>=24.0",
    "typer>=0.12,<0.27",
]

[project.scripts]
eksupgrade = "eksupgrade.cli:app"

[dependency-groups]
test = [
    "pytest>=7.4,<8",
    "pytest-cov>=4.1,<5",
    "coverage>=7.4,<8",
    "moto[autoscaling,ec2,eks,ssm,sts]>=4.2,<5",
]
dev = [
    "isort>=5.13,<6",
    "black>=23.12,<25.0",
    "pydocstyle>=6.3,<7",
    "mypy>=1.8,<2",
    "debugpy>=1.8,<2",
    "ruff>=0.1,<0.2",
    "poethepoet>=0.24",
]
security = [
    "safety>=3.0,<4",
    "bandit[toml]>=1.7,<2",
]
types = [
    "types-pyyaml>=6.0,<7",
    "boto3-stubs[autoscaling,ec2,eks,ssm,sts]>=1.32,<2",
]

[tool.uv]
default-groups = ["test", "dev", "security", "types"]

[tool.bandit]
exclude_dirs = ["tests"]

# Styling and linting Configurations
[tool.isort]
profile = "black"
line_length = 120

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.poe.tasks]
isort = "isort --profile=black ."
black = "black ."
check-black = {cmd = "black . --check --diff", help = "Check code for black styling"}
check-isort = {cmd = "isort --check --profile=black .", help = "Check code for import styling"}
check-docstrings = "pydocstyle -e ."
check-ruff = "ruff check eksupgrade"
check = ["check-isort", "check-black"]
lint = ["check-docstrings", "check-ruff"]
fix = ["isort", "black"]
test = "pytest --cov=eksupgrade --cov-report=xml --cov-report=term"
ruff = "ruff check --fix eksupgrade"
# Ignored advisories are all in DEV/TEST-only deps (`dev`/`test` dependency groups),
# never installed with the distributed CLI (pip/pipx), so no runtime exposure.
# Pinned to exact IDs so genuine runtime vulnerabilities are still reported.
#   64459, 64396 -> ecdsa (transitive via moto; CVE-2024-23342 Minerva, no upstream fix)
#   89047        -> black (dev-only formatter)
#   SFTY-20260122-20373 -> pytest (test-only)
safety = "safety check --ignore 64459 --ignore 64396 --ignore 89047 --ignore SFTY-20260122-20373"
bandit = "bandit -r eksupgrade"
security = ["safety", "bandit"]
install = "uv sync"
build = "uv build"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eksupgrade"]

[tool.hatch.build.targets.sdist]
include = ["eksupgrade", "README.md"]

[[tool.mypy.overrides]]
module = ["kubernetes.*"]
ignore_missing_imports = true
